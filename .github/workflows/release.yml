name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # The release is created ONCE, here, before any build runs.
  #
  # Without this the two matrix jobs race: both call electron-builder with
  # --publish always, both try to CREATE the GitHub release, and whichever
  # loses gets `422 Unprocessable Entity ... tag_name already_exists` and
  # fails — after building perfectly well. That is exactly how v0.8.0 shipped
  # with only the macOS artifacts. It had been passing on luck: the two builds
  # happened to finish far enough apart that one saw the other's release
  # already there.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
            exit 0
          fi

          # The release BODY is what the in-app update panel shows as the
          # changelog (electron-updater reads it as releaseNotes), so it is
          # the hand-written CHANGELOG section for this tag — not a generated
          # commit list. Falls back to generated notes if the section is
          # missing, because a release with no notes is worse than machine
          # ones.
          awk -v tag="${TAG}" '
            $0 ~ "^## " tag " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ -s /tmp/notes.md ]; then
            echo "using the CHANGELOG section for $TAG"
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            echo "no CHANGELOG section for $TAG — falling back to generated notes"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
          - os: macos-latest
            build-script: build:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      # Uploads into the release created above. electron-builder finds the
      # existing release by tag and adds its assets to it.
      - run: npm run ${{ matrix.build-script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A green build that published nothing is the failure mode this whole
      # file exists to prevent, so say out loud what landed.
      - name: List published assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'

  # The headless relay for DCS servers (RELAY.md): one zip and its SHA-256,
  # from the same tag as the app. node.exe is the runner's own Node, as the
  # Node.js project publishes it — signed, which is the point: an unsigned
  # executable is what Defender's ML heuristic quarantines. The step after the
  # build refuses to ship one whose signature does not check out.
  relay:
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The relay needs `ws` and nothing else; no Electron download.
      - run: npm ci --omit=dev --ignore-scripts

      - run: node scripts/build-relay.js

      - name: Check node.exe is signed
        run: |
          $sig = Get-AuthenticodeSignature dist/relay/taclink-relay/node.exe
          "node.exe signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "node.exe is not validly signed" }

      - name: Zip, hash and attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "taclink-relay-$v-win-x64.zip"
          Compress-Archive -Path dist/relay/taclink-relay -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Get-Content "$zip.sha256"
          gh release upload "$env:GITHUB_REF_NAME" $zip "$zip.sha256" --clobber
