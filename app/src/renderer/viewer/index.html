<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Intel Broadcast Viewer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #photo {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    display: none;
  }

  #idle {
    color: #666;
    font-size: 1.1rem;
    letter-spacing: 0.03em;
  }

  #index-indicator {
    position: fixed;
    bottom: 12px;
    /* Clear of the collapsed rail, which is always on the right edge. */
    right: 60px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 0.85rem;
    display: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }

  #disconnected-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #7a1f1f;
    color: #fff;
    text-align: center;
    padding: 6px 0;
    font-size: 0.85rem;
    display: none;
  }

  /* ---- Side panel -------------------------------------------------------
     Overlays the photo rather than reflowing it: OpenKneeboard captures this
     window, and a layout that shifted every time the panel opened would move
     the kneeboard image under the pilot. */
  #side-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    font-size: 13px;
    color: #ddd;
  }

  #rail {
    width: 44px;
    background: rgba(18, 18, 18, 0.88);
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-top: 8px;
    /* Faded while another app (i.e. DCS) has focus, so the rail stays
       essentially invisible in the kneeboard capture but is still there when
       you look at the real window. */
    opacity: 0.2;
    transition: opacity 0.15s ease;
  }
  body.focused #rail { opacity: 1; }
  #side-panel.open #rail { display: none; }

  .rail-btn {
    position: relative;
    width: 34px;
    height: 34px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    color: #cfcfcf;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .rail-btn:hover { background: #333; border-color: #444; }
  .rail-btn.active { background: #2c3b31; border-color: #3f6a4e; color: #fff; }

  .badge {
    position: absolute;
    top: -3px;
    right: -3px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    box-sizing: border-box;
    border-radius: 8px;
    background: #c8442f;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
  }

  #panel-body {
    width: 290px;
    background: rgba(24, 24, 24, 0.97);
    border-left: 1px solid #333;
    display: none;
    flex-direction: column;
  }
  #side-panel.open #panel-body { display: flex; }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid #333;
  }
  .tab-btn {
    flex: 1;
    padding: 6px 4px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: #aaa;
    font-size: 12px;
    cursor: pointer;
    position: relative;
  }
  .tab-btn:hover { background: #2e2e2e; }
  .tab-btn.active { background: #2c3b31; border-color: #3f6a4e; color: #fff; }
  .icon-btn {
    width: 26px;
    height: 26px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #2a2a2a;
    color: #ddd;
    cursor: pointer;
    line-height: 1;
    font-size: 14px;
  }
  .icon-btn:hover { background: #383838; }

  .tab-panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tab-panel.active { display: flex; }

  .panel-empty { color: #777; padding: 14px 12px; font-size: 12px; line-height: 1.5; }

  /* ---- Received tab ---- */
  #intel-list { overflow-y: auto; flex: 1; }
  .intel-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid #2a2a2a;
    border-left: 3px solid transparent;
    cursor: pointer;
  }
  .intel-row:hover { background: #2c2c2c; }
  .intel-row.current { background: #23372c; border-left-color: #4caf6d; }
  .intel-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: transparent;
    flex-shrink: 0;
  }
  .intel-row.unread .intel-dot { background: #c8442f; }
  .intel-who {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .intel-row.unread .intel-who { font-weight: 600; color: #fff; }
  .intel-meta { color: #8a8a8a; font-size: 11px; flex-shrink: 0; }

  /* ---- Share tab ---- */
  .share-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid #2a2a2a;
  }
  .share-toolbar button {
    padding: 4px 8px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #2a2a2a;
    color: #ddd;
    font-size: 11px;
    cursor: pointer;
  }
  .share-toolbar button:hover { background: #383838; }
  #share-folder {
    padding: 5px 10px;
    color: #7d7d7d;
    font-size: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl; /* keeps the folder name visible when the path is long */
    text-align: left;
  }
  #share-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: 8px;
    align-content: start;
  }
  .share-tile {
    position: relative;
    border: 2px solid #3a3a3a;
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    background: #111;
  }
  .share-tile.selected { border-color: #4caf6d; }
  .share-tile img {
    width: 100%;
    height: 62px;
    object-fit: cover;
    display: block;
    opacity: 0.55;
  }
  .share-tile.selected img { opacity: 1; }
  .share-tile .tile-name {
    padding: 3px 5px;
    font-size: 10px;
    color: #bbb;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .share-tile .tile-check {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 15px;
    height: 15px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid #666;
    color: #fff;
    font-size: 11px;
    line-height: 14px;
    text-align: center;
  }
  .share-tile.selected .tile-check {
    background: #4caf6d;
    border-color: #4caf6d;
  }
  .tile-missing {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 10px;
  }

  #share-action { padding: 8px; border-top: 1px solid #2a2a2a; }
  #share-btn {
    width: 100%;
    padding: 8px;
    border: 1px solid #3f8f66;
    border-radius: 4px;
    background: #2f6f4f;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  #share-btn:hover:not(:disabled) { background: #367a58; }
  #share-btn:disabled { background: #333; border-color: #444; color: #777; cursor: default; }
  #share-note { margin-top: 6px; color: #7d7d7d; font-size: 10px; line-height: 1.4; text-align: center; }
</style>
</head>
<body>
  <div id="stage">
    <div id="idle">Waiting for reveal&hellip;</div>
    <img id="photo" alt="" />
  </div>
  <div id="index-indicator"></div>
  <div id="disconnected-banner">Disconnected from relay &mdash; reconnecting&hellip;</div>

  <div id="side-panel">
    <div id="rail">
      <button class="rail-btn" id="rail-received" title="Received intel">
        &#9776;<span class="badge" id="unread-badge" hidden>0</span>
      </button>
      <button class="rail-btn" id="rail-share" title="Share photos">&#8593;</button>
      <button class="rail-btn" id="rail-settings" title="Settings">&#9881;</button>
    </div>

    <div id="panel-body">
      <div class="panel-header">
        <button class="tab-btn" id="tab-received" data-tab="received">
          Received<span class="badge" id="tab-badge" hidden>0</span>
        </button>
        <button class="tab-btn" id="tab-share" data-tab="share">Share</button>
        <button class="icon-btn" id="panel-settings" title="Settings">&#9881;</button>
        <button class="icon-btn" id="panel-close" title="Collapse panel">&times;</button>
      </div>

      <div class="tab-panel" id="panel-received">
        <div id="intel-list"></div>
      </div>

      <div class="tab-panel" id="panel-share">
        <div class="share-toolbar">
          <button id="select-all">Select all</button>
          <button id="select-none">None</button>
          <button id="share-refresh" title="Re-read the folder">&#8635;</button>
        </div>
        <div id="share-folder"></div>
        <div id="share-grid"></div>
        <div id="share-action">
          <button id="share-btn" disabled>Share</button>
          <div id="share-note"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="intelHistory.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
