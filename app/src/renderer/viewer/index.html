<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Intel Broadcast Viewer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #photo {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    display: none;
  }

  #idle {
    color: #666;
    font-size: 1.1rem;
    letter-spacing: 0.03em;
  }

  #index-indicator {
    position: fixed;
    bottom: 12px;
    right: 16px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 0.85rem;
    display: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }

  #disconnected-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #7a1f1f;
    color: #fff;
    text-align: center;
    padding: 6px 0;
    font-size: 0.85rem;
    display: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="idle">Waiting for reveal&hellip;</div>
    <img id="photo" alt="" />
  </div>
  <div id="index-indicator"></div>
  <div id="disconnected-banner">Disconnected from relay &mdash; reconnecting&hellip;</div>
  <script src="viewer.js"></script>
</body>
</html>
