<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Intel Broadcast Settings</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #1c1c1c;
    color: #eee;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.9rem;
  }
  h2 { margin: 0 0 12px; font-size: 1rem; color: #fff; }
  h3 { margin: 20px 0 8px; font-size: 0.85rem; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
  label { display: block; margin: 12px 0 4px; color: #bbb; }
  input[type="text"], input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    color: #eee;
  }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  button {
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #333;
    color: #eee;
    cursor: pointer;
  }
  button:hover { background: #3d3d3d; }
  #save { background: #2f6f4f; border-color: #3f8f66; margin-top: 20px; width: 100%; padding: 8px; }
  #save:hover { background: #367a58; }
  .hint {
    margin-top: 16px;
    padding: 10px;
    background: #262626;
    border-left: 3px solid #555;
    font-size: 0.8rem;
    color: #aaa;
    line-height: 1.4;
    display: none;
  }
  .hint code { color: #ddd; }

  .hotkey-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .hotkey-name { flex: 1; color: #ddd; }
  .hotkey-value {
    min-width: 130px;
    text-align: center;
    padding: 4px 8px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 0.85rem;
    color: #eee;
  }
  .record-btn.recording {
    background: #6f4f2f;
    border-color: #8f6a3f;
    color: #fff;
  }

  .gm-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    margin-bottom: 8px;
    background: #262626;
    border-radius: 4px;
  }
  .gm-toggle input { margin: 0; }
  .gm-toggle label { margin: 0; color: #ddd; }

  #tailscale-panel {
    background: #262626;
    border-radius: 4px;
    padding: 10px;
  }
  .ts-status { display: flex; align-items: center; gap: 8px; }
  .ts-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777;
    flex-shrink: 0;
  }
  .ts-dot.ok { background: #4caf6d; }
  .ts-dot.warn { background: #d9a13b; }
  .ts-dot.bad { background: #c25454; }
  #ts-status-text { color: #ccc; line-height: 1.4; }
  .ts-url-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .ts-url-row code {
    flex: 1;
    background: #1d1d1d;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 5px 8px;
    color: #9bd4ae;
    overflow-x: auto;
    white-space: nowrap;
  }
  .ts-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .ts-actions:empty { display: none; }
  .ts-funnel-toggle { margin: 10px 0 0; background: #1f1f1f; }

  .field-note {
    margin-top: 4px;
    color: #8a8a8a;
    font-size: 0.75rem;
    line-height: 1.4;
  }
  #save-status {
    margin-top: 8px;
    min-height: 16px;
    text-align: center;
    font-size: 0.8rem;
    color: #7fc79a;
  }
  #diagnostics {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #diagnostics button { font-size: 0.75rem; padding: 4px 8px; }
  #log-path {
    color: #6d6d6d;
    font-size: 0.68rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
    flex: 1;
  }
  .ts-detail {
    margin-top: 6px;
    padding: 6px 8px;
    background: #1d1d1d;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    color: #a9a9a9;
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 0.68rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 130px;
    overflow-y: auto;
  }

  #connected-clients {
    background: #262626;
    border-radius: 4px;
    padding: 4px 10px;
  }
  .clients-empty { color: #777; padding: 6px 0; font-size: 0.85rem; }
  .client-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #2f2f2f;
  }
  .client-row:last-child { border-bottom: none; }
  .client-callsign { flex: 1; color: #ddd; }
  .client-callsign.unnamed { color: #888; font-style: italic; }
  .client-role {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9bc4a8;
    background: #223327;
    border: 1px solid #2f4f3a;
    border-radius: 3px;
    padding: 2px 6px;
  }
</style>
</head>
<body>
  <h2 id="heading">Settings</h2>

  <label for="callsign">Callsign / username (shown to the squad)</label>
  <input type="text" id="callsign" />

  <label for="photosFolder">Photos folder to share (your reveal hotkey sends this to everyone)</label>
  <div class="row">
    <input type="text" id="photosFolder" readonly />
    <button id="browse">Browse&hellip;</button>
  </div>

  <label for="token">Shared token</label>
  <input type="text" id="token" />

  <div class="gm-toggle">
    <input type="checkbox" id="hostToggle" />
    <label for="hostToggle">Host the relay on this machine (the squad's center node)</label>
  </div>

  <div id="host-fields" style="display:none">
    <label for="relayPort">Relay listen port</label>
    <input type="number" id="relayPort" />

    <h3>Internet sharing (Tailscale Funnel)</h3>
    <div id="tailscale-panel">
      <div class="ts-status">
        <span id="ts-dot" class="ts-dot"></span>
        <span id="ts-status-text">Checking Tailscale&hellip;</span>
      </div>
      <div id="ts-url-row" class="ts-url-row" style="display:none">
        <code id="ts-url"></code>
        <button id="ts-copy-invite" type="button">Copy invite</button>
      </div>
      <div id="ts-actions" class="ts-actions"></div>
      <div class="gm-toggle ts-funnel-toggle">
        <input type="checkbox" id="funnelToggle" />
        <label for="funnelToggle">Share the relay publicly while the app runs (needs Save)</label>
      </div>
    </div>

    <h3>Connected clients</h3>
    <div id="connected-clients">
      <div class="clients-empty">No one connected yet.</div>
    </div>
  </div>

  <div id="connect-fields">
    <label for="relayUrl">Relay URL &mdash; paste the link from whoever hosts the relay</label>
    <input type="text" id="relayUrl" placeholder="wss://host-machine.tailnet.ts.net" />
    <div id="relayUrl-note" class="field-note"></div>
  </div>

  <h3>Hotkeys (this machine)</h3>
  <div id="hotkey-rows">
    <div class="hotkey-row" id="row-reveal">
      <span class="hotkey-name">Reveal to everyone</span>
      <span class="hotkey-value" id="value-reveal">&mdash;</span>
      <button class="record-btn" data-key="reveal">Record</button>
    </div>
    <div class="hotkey-row">
      <span class="hotkey-name">Previous photo</span>
      <span class="hotkey-value" id="value-prev">&mdash;</span>
      <button class="record-btn" data-key="prev">Record</button>
    </div>
    <div class="hotkey-row">
      <span class="hotkey-name">Next photo</span>
      <span class="hotkey-value" id="value-next">&mdash;</span>
      <button class="record-btn" data-key="next">Record</button>
    </div>
    <div class="hotkey-row">
      <span class="hotkey-name">Open Settings</span>
      <span class="hotkey-value" id="value-settings">&mdash;</span>
      <button class="record-btn" data-key="settings">Record</button>
    </div>
  </div>

  <button id="save">Save &amp; Apply</button>
  <div id="save-status"></div>
  <div id="diagnostics">
    <button id="open-log" type="button">Open log file&hellip;</button>
    <span id="log-path"></span>
  </div>

  <script src="settings.js"></script>
</body>
</html>
