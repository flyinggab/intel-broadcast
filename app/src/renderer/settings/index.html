<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Intel Broadcast Settings</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #1c1c1c;
    color: #eee;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.9rem;
  }
  h2 { margin: 0 0 12px; font-size: 1rem; color: #fff; }
  label { display: block; margin: 12px 0 4px; color: #bbb; }
  input[type="text"], input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    color: #eee;
  }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  button {
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #333;
    color: #eee;
    cursor: pointer;
  }
  button:hover { background: #3d3d3d; }
  #save { background: #2f6f4f; border-color: #3f8f66; margin-top: 20px; width: 100%; padding: 8px; }
  #save:hover { background: #367a58; }
  .hint {
    margin-top: 16px;
    padding: 10px;
    background: #262626;
    border-left: 3px solid #555;
    font-size: 0.8rem;
    color: #aaa;
    line-height: 1.4;
    display: none;
  }
  .hint code { color: #ddd; }
</style>
</head>
<body>
  <h2 id="heading">Settings</h2>

  <div id="gm-fields" style="display:none">
    <label for="photosFolder">Photos folder to share</label>
    <div class="row">
      <input type="text" id="photosFolder" readonly />
      <button id="browse">Browse&hellip;</button>
    </div>

    <label for="relayPort">Relay listen port</label>
    <input type="number" id="relayPort" />

    <label for="hotkeyReveal">Reveal hotkey</label>
    <input type="text" id="hotkeyReveal" placeholder="Ctrl+Shift+I" />

    <div id="tailscale-hint" class="hint"></div>
  </div>

  <div id="pilot-fields" style="display:none">
    <label for="relayUrl">Relay URL (from your GM)</label>
    <input type="text" id="relayUrl" placeholder="wss://your-gm-machine.tailnet.ts.net" />

    <label for="callsign">Callsign (optional)</label>
    <input type="text" id="callsign" />
  </div>

  <label for="token">Shared token</label>
  <input type="text" id="token" />

  <label>Browsing hotkeys (this machine)</label>
  <div class="row">
    <input type="text" id="hotkeyPrev" placeholder="Ctrl+Shift+Left" />
    <input type="text" id="hotkeyNext" placeholder="Ctrl+Shift+Right" />
  </div>

  <button id="save">Save &amp; Restart</button>

  <script src="settings.js"></script>
</body>
</html>
