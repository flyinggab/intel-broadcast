<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Intel Broadcast Settings</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #1c1c1c;
    color: #eee;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.9rem;
  }
  h2 { margin: 0 0 12px; font-size: 1rem; color: #fff; }
  h3 { margin: 20px 0 8px; font-size: 0.85rem; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
  label { display: block; margin: 12px 0 4px; color: #bbb; }
  input[type="text"], input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    color: #eee;
  }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  button {
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #333;
    color: #eee;
    cursor: pointer;
  }
  button:hover { background: #3d3d3d; }
  #save { background: #2f6f4f; border-color: #3f8f66; margin-top: 20px; width: 100%; padding: 8px; }
  #save:hover { background: #367a58; }
  .hint {
    margin-top: 16px;
    padding: 10px;
    background: #262626;
    border-left: 3px solid #555;
    font-size: 0.8rem;
    color: #aaa;
    line-height: 1.4;
    display: none;
  }
  .hint code { color: #ddd; }

  .hotkey-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .hotkey-name { flex: 1; color: #ddd; }
  .hotkey-value {
    min-width: 130px;
    text-align: center;
    padding: 4px 8px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 0.85rem;
    color: #eee;
  }
  .record-btn.recording {
    background: #6f4f2f;
    border-color: #8f6a3f;
    color: #fff;
  }

  .gm-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    margin-bottom: 8px;
    background: #262626;
    border-radius: 4px;
  }
  .gm-toggle input { margin: 0; }
  .gm-toggle label { margin: 0; color: #ddd; }
</style>
</head>
<body>
  <h2 id="heading">Settings</h2>

  <div class="gm-toggle">
    <input type="checkbox" id="gmModeToggle" />
    <label for="gmModeToggle">Enable Game Master mode (host the relay + reveal hotkey)</label>
  </div>

  <div id="gm-fields" style="display:none">
    <label for="photosFolder">Photos folder to share</label>
    <div class="row">
      <input type="text" id="photosFolder" readonly />
      <button id="browse">Browse&hellip;</button>
    </div>

    <label for="relayPort">Relay listen port</label>
    <input type="number" id="relayPort" />

    <div id="tailscale-hint" class="hint"></div>
  </div>

  <div id="pilot-fields" style="display:none">
    <label for="relayUrl">Relay URL (from your GM)</label>
    <input type="text" id="relayUrl" placeholder="wss://your-gm-machine.tailnet.ts.net" />

    <label for="callsign">Callsign (optional)</label>
    <input type="text" id="callsign" />
  </div>

  <label for="token">Shared token</label>
  <input type="text" id="token" />

  <h3>Hotkeys (this machine)</h3>
  <div id="hotkey-rows">
    <div class="hotkey-row" id="row-reveal">
      <span class="hotkey-name">Reveal to everyone</span>
      <span class="hotkey-value" id="value-reveal">&mdash;</span>
      <button class="record-btn" data-key="reveal">Record</button>
    </div>
    <div class="hotkey-row">
      <span class="hotkey-name">Previous photo</span>
      <span class="hotkey-value" id="value-prev">&mdash;</span>
      <button class="record-btn" data-key="prev">Record</button>
    </div>
    <div class="hotkey-row">
      <span class="hotkey-name">Next photo</span>
      <span class="hotkey-value" id="value-next">&mdash;</span>
      <button class="record-btn" data-key="next">Record</button>
    </div>
    <div class="hotkey-row">
      <span class="hotkey-name">Open Settings</span>
      <span class="hotkey-value" id="value-settings">&mdash;</span>
      <button class="record-btn" data-key="settings">Record</button>
    </div>
  </div>

  <button id="save">Save &amp; Restart</button>

  <script src="settings.js"></script>
</body>
</html>
