<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Intel Broadcast</title>
<!--
  VIEWER — the window OpenKneeboard captures.

  v0.4: BRIEF is the kneeboard itself — a thin connection strip, then the
  photo queue edge to edge (newest batch first; arrivals prepend). RECEIVED
  curates that queue. There is no frame page and no unread badge any more,
  and no hotkey is printed anywhere in this window: bindings live in
  SETUP → KEYS, the one place they are always current.

  Ships EMPTY: no demo content, no placeholder photos, no fake callsigns —
  the first frame a pilot can ever see is truthful (STANDBY, blank strip).
  preview.html populates it by driving the real render with fake snapshots
  through the window.__preview hook at the bottom of viewer.js.

  States, set as attributes on <body>:
    data-page          brief | received | share | fault
    data-surface       window (phase 4 adds "vr" — do not remove)
    .is-chrome-hidden  everything but the photo goes away
    .is-unfocused      DCS has focus; chrome dims
-->
<link rel="icon" href="img/favicon.png" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body class="viewer" data-surface="window" data-page="brief">
<div class="shell">

  <!-- ============================================ connection strip ====
       The only information above the photo: who you are, the net, the
       relay. One line, non-interactive, 28px of the capture. -->
  <header class="strip" id="strip">
    <span class="strip__seg strip__seg--id" id="strip-callsign"></span>
    <span class="strip__seg" id="strip-net"></span>
    <span class="strip__seg" id="strip-relay"></span>
  </header>

  <!-- ================================================= arrival banner ====
       Shown for every arrival (there is no badge): QUEUED when the page held
       still, SWITCHED AUTOMATICALLY when it moved. Auto-dismisses. -->
  <div class="banner is-hidden" id="banner">
    <div class="banner__text">
      <div class="banner__who" id="banner-who"></div>
      <div class="meta" id="banner-meta"></div>
    </div>
    <button class="banner__close" id="banner-close" aria-label="Dismiss">&times;</button>
  </div>

  <main class="body">

    <!-- =============================================== BRIEF ==========
         The kneeboard. The queue's current photo edge to edge; chrome
         floats and never displaces it, because a layout shift here moves
         the image under the pilot mid-flight. STANDBY when the queue is
         empty. -->
    <section class="page page--flush" data-page="brief">
      <div class="stage">
        <img class="stage__img" id="stage-img" src="img/frame-placeholder.svg" alt="" />
        <div class="stage__chrome">
          <button class="stage__nav stage__nav--prev" id="stage-prev" aria-label="Previous">&lsaquo;</button>
          <button class="stage__nav stage__nav--next" id="stage-next" aria-label="Next">&rsaquo;</button>
          <div class="stage__foot">
            <span class="stage__file" id="stage-file"></span>
            <span class="stage__pos"><span id="stage-pos-n"></span><span class="stage__pos-meta" id="stage-pos-meta"></span></span>
          </div>
        </div>
        <div class="stage__standby" id="stage-standby">
          <div class="plate stage__standby-plate">
            <p class="plate__title" data-i18n="standby.title">STANDBY</p>
            <p class="plate__sub" id="standby-line1"></p>
            <p class="plate__sub" id="standby-line2"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- =============================================== RECEIVED =======
         Curation of the brief: every received photo, batch by batch. A
         tile toggled off is not in the queue; HIDE drops a whole batch.
         Same tile idiom as SHARE — selection decides what you SEE here,
         what you SEND there. -->
    <section class="page page--flush" data-page="received">
      <!-- The auto-switch rule, above the batches it governs. Moved here from
           settings: one tap, ground use. OFF still shows the QUEUED banner,
           so an arrival is never silent. -->
      <div class="toggle toggle--flush" id="tg-autoshow" role="switch" aria-checked="true">
        <span class="toggle__label"><span data-i18n="received.autoshow">SHOW NEW INTEL ON ARRIVAL</span>
          <span class="meta toggle__hint" data-i18n="received.autoshowHint">SWITCHES THE BRIEF FOR YOU · OFF = BANNER ONLY</span></span>
        <i class="switch"></i>
      </div>
      <div id="batches"></div>
    </section>

    <!-- =============================================== SHARE ========== -->
    <section class="page page--pad stack" data-page="share">
      <div class="cellrow">
        <div class="cell">
          <span class="cap" data-i18n="cap.folder">Folder</span>
          <span class="cell__val truncate" id="share-folder"></span>
        </div>
        <div class="cell">
          <span class="cap" data-i18n="cap.selected">Selected</span>
          <span class="cell__val" id="share-count"></span>
        </div>
      </div>

      <!-- Above the grid on purpose: below it, a full folder pushed these off
           the bottom and you had to scroll the whole gallery to select all or
           change folder. The controls that act on the grid come first. -->
      <div class="keyrow">
        <button class="key--sm key" id="share-all" data-i18n="share.all">SELECT ALL</button>
        <button class="key--sm key" id="share-none" data-i18n="share.none">NONE</button>
        <!-- The folder lives here, next to what it feeds — not in settings. -->
        <button class="key--sm key" id="share-folder-btn" data-i18n="share.folderBtn">FOLDER&hellip;</button>
      </div>

      <div class="tiles" id="share-grid"></div>

      <!-- No printed hotkey here: bindings live in SETUP → KEYS. -->
      <button class="key key--lg key--primary" id="share-reveal" disabled></button>
    </section>

    <!-- =============================================== FAULT ==========
         The only screen in the app that uses the fault hue. -->
    <section class="page page--pad stack" data-page="fault">
      <div class="plate plate--fault">
        <p class="plate__title" data-i18n="fault.title">RELAY LOST</p>
        <p class="plate__sub" data-i18n="fault.reconnecting">RECONNECTING</p>
        <p class="meta" id="fault-attempt" style="margin-top:.5rem"></p>
      </div>

      <div class="cellrow">
        <div class="cell">
          <span class="cap" data-i18n="cap.lastContact">Last contact</span>
          <span class="cell__val cell__val--mono" id="fault-last"></span>
        </div>
        <div class="cell">
          <span class="cap" data-i18n="cap.relay">Relay</span>
          <span class="cell__val truncate" id="fault-relay"></span>
        </div>
      </div>

      <div>
        <span class="cap" data-i18n="cap.offline">Still available offline</span>
        <div class="well" style="padding:var(--sp-4)">
          <div class="val" style="font-size:var(--fs-key)" id="fault-cached"></div>
          <div class="meta" style="margin-top:.35rem" data-i18n="fault.offlineHint">BROWSE AND SHARE STILL WORK</div>
        </div>
      </div>

      <div class="keyrow">
        <button class="key" id="fault-retry" data-i18n="fault.retry">RETRY NOW</button>
        <button class="key" id="fault-setup" data-i18n="fault.openSetup">OPEN SETUP</button>
      </div>
    </section>

  </main>

  <!-- ================================================= tab bar ======== -->
  <nav class="tabbar">
    <button class="tab is-active" data-tab="brief">
      <svg class="tab__icon" viewBox="0 0 20 20"><rect x="3" y="2" width="14" height="16"/><path d="M6 7h8M6 11h8M6 15h5"/></svg>
      <span data-i18n="tab.brief">BRIEF</span>
    </button>
    <button class="tab" data-tab="received">
      <svg class="tab__icon" viewBox="0 0 20 20"><path d="M10 2v9M6 8l4 4 4-4" stroke-linecap="round"/><path d="M3 14h14v4H3z"/></svg>
      <span data-i18n="tab.received">RECEIVED</span>
    </button>
    <button class="tab" data-tab="share">
      <svg class="tab__icon" viewBox="0 0 20 20"><path d="M10 13V4M6 7l4-4 4 4" stroke-linecap="round"/><path d="M3 14h14v4H3z"/></svg>
      <span data-i18n="tab.share">SHARE</span>
    </button>
    <!-- opens the SEPARATE settings window; does not switch a page here -->
    <button class="tab" data-tab="setup" id="tab-setup">
      <svg class="tab__icon" viewBox="0 0 20 20"><path d="M2 5h16M2 10h16M2 15h16"/><circle cx="7" cy="5" r="2" fill="currentColor" stroke="none"/><circle cx="13" cy="10" r="2" fill="currentColor" stroke="none"/><circle cx="6" cy="15" r="2" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="tab.setup">SETUP</span>
    </button>
  </nav>

</div>
<script src="i18n.js"></script>
<script src="viewer/format.js"></script>
<script src="viewer/viewer.js"></script>
</body>
</html>
