# =============================================================================
# LAYOUT TEMPLATE — strike-package
#
# This file describes SHAPE ONLY. It contains no mission data, no colours, no
# sizes and no fonts. Content comes from a card JSON; appearance comes from the
# EFB. The same template renders Foxhunt 2, Dust and Steel, or any other
# strike card whose JSON matches the same paths.
#
# BINDING
#   "{path}"          value from the card JSON, relative to the block's `bind`
#   "{path|dash}"     fallback filter — renders an em dash when missing
#   repeat: a.b       render one row per element of that array
#   when: a.b         omit the whole block if that path is missing or empty
#   mark: field       per-row boolean; raises the go bar on rows where it is true
#
#   Paths are bare in `when`, `repeat`, `bind` and `mark` — they are tests and
#   sources, not text. Braces appear only where a value is rendered.
#
# WHAT A TEMPLATE MAY NOT SAY
#   colours, hex values, px, fonts, weights. `emphasis` and `width` are
#   semantic: the EFB decides what each one looks like, and phase 4 will decide
#   differently for a VR quad without this file changing.
# =============================================================================

schema: 1
id: strike-package
name: Strike package
requires: [flight, threats, route, comms]     # import fails loudly if absent

pages:
  # ---------------------------------------------------------------- CARD
  # ONE page. Paging to find your bullseye mid-flight is the failure a
  # kneeboard exists to prevent — see HANDOFF.md §1. Only MAP is separate,
  # because it is an image.
  - id: card
    label: CARD
    layout: single

    blocks:
      # --- header band: what you need before you read the route -----------
      - type: fields
        band: header
        items:
          - { label: CALLSIGN,   value: "{flight.callsign}", width: sm }
          - { label: BULLSEYE,   value: "{flight.bullseye}", width: md, style: mono }
          - { label: S-A THREAT, value: "{threats.surface}", width: md, emphasis: threat }
          - { label: A-A THREAT, value: "{threats.air}",     width: flex, emphasis: threat }

      - type: stations
        band: header
        title: LOADOUT
        when: flight.stations
        repeat: flight.stations
        wrap: 9                    # one row across the band
        cell:
          value: "{load}"
          label: "{station}"
          state: "{kind|none}"

      # --- route ----------------------------------------------------------
      # Four real columns, every note visible on every row. `steps` no longer
      # collapses: at 893 wide the table needs 561px and nothing has to hide.
      # `state` drives emphasis only — current is raised, done ticks and dims.
      - type: steps
        title: ROUTE
        repeat: route.steps
        complete: done             # per-row boolean the hold-target writes
        row:
          name:  "{name}"
          ref:   "{ref}"
          gate:  "{alt} / {speed}"
          note:  "{note|blank}"
          state: "{state|none}"

      # --- targets --------------------------------------------------------
      - type: table
        title: TARGETS
        when: route.targets
        repeat: route.targets
        columns:
          - { value: "{name}",       width: sm,   emphasis: strong }
          - { value: "{wp}",         width: xs,   style: mono }
          - { value: "{coord|dash}", width: md,   style: mono }
          - { value: "{desc}",       width: flex }
          - { value: "{weapon|dash}", width: sm,  emphasis: muted }
          - { value: "{laser|dash}", width: xs,   style: mono, emphasis: strong }

      # --- primary radio --------------------------------------------------
      - type: table
        band: comms
        column: 1
        title: COMM 1
        repeat: comms.primary
        columns:
          - { value: "{ch}",        width: badge, style: mono }
          - { value: "{name}",      width: flex,  emphasis: strong }
          - { value: "{freq}",      width: sm,    style: mono }
          - { value: "{tacan|dash}", width: xs,   style: mono, emphasis: muted }

      # --- datalink -------------------------------------------------------
      - type: table
        band: comms
        column: 2
        title: MIDS
        when: comms.mids
        repeat: comms.mids
        columns:
          - { value: "{name}",    width: flex, emphasis: strong }
          - { value: "{channel}", width: xs,   style: mono }

      # --- tankers and divert ---------------------------------------------
      # One table, because in the air they answer the same question: where do
      # I go and on what channel. `mark` raises the go bar on the row the
      # content flags — the template does not know which row that is.
      - type: table
        band: comms
        column: 3
        title: TANKER · DIVERT
        repeat: comms.fields
        mark: next                 # per-row boolean path, like `when`
        columns:
          - { value: "{name}",   width: md,   emphasis: strong }
          - { value: "{tacan|dash}", width: xs, style: mono }
          - { value: "{alt|dash}",   width: flex, style: mono }
          - { value: "{hdg|dash}",   width: sm,  style: mono }

      # --- game plan ------------------------------------------------------
      - type: prose
        title: GAME PLAN
        bind: plan
        badge: "{bingo}"
        list:  flow

  # ---------------------------------------------------------------- MAP
  - id: map
    label: MAP
    layout: full-bleed
    when: map
    blocks:
      - type: image
        bind: map
        source: "{blob}"           # content-addressed hash, never a URL
        caption: "{caption|blank}"
